rows:
  - item: "추납 신청자격과 신청기한"
    value: "국민연금에 소득신고하거나 임의(계속)가입 중인 경우 신청 가능. 자격유지 기간 중 신청. 자격 상실 시 신청 불가(기 신청분은 징수권 소멸 전까지 납부 가능). 사망 및 연금수급 등의 경우 납부 불가"
    agency: "국민연금공단"
    document: "연금보험료의 추후납부(추납) 안내"
