  - item: "추납 대상 기간"
    value: "납부예외 기간 / 연금보험료를 1개월 이상 납부한 날 이후 적용제외된 기간(1999.4.1 이후 무소득배우자, 2001.4.1 이후 기초수급자, 2008.1.1 이후 1년 이상 행방불명자, 2015.7.29 이후 18세 미만 사업장가입자) / 1988.1.1 이후 군복무기간(군인연금·타공적연금 가입기간에 포함된 기간 제외)"
    agency: "국민연금공단"
    document: "연금보험료의 추후납부(추납) 안내"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0047M0.do"
    effectiveDate: "2026-01-01"
    checkedAt: 2026-11-11
    result: verified
  - item: "추납 한도(10년 미만, 최대 119개월)"
    value: "법 제92조제1항 '10년 미만의 범위'. 공단 안내 '군복무기간을 포함하여 최대 119개월까지만 신청 가능'. 전부 또는 일부 기간 신청 가능"
    agency: "국가법령정보센터 / 국민연금공단"
    document: "국민연금법 제92조제1항, 추납 안내"
    url: "https://www.law.go.kr/법령/국민연금법"
    effectiveDate: "2026-10-20"
    checkedAt: 2026-11-11
    result: verified
  - item: "반환일시금을 받은 경우의 추납 대상 기간"
    value: "법 제92조제2항: 납부한 연금보험료를 반환일시금으로 지급받은 경우 그 기간은 연금보험료를 납부한 것으로 보지 않음. 다만 반납금으로 납부한 경우는 예외"
    agency: "국가법령정보센터"
    document: "국민연금법 제92조제2항"
    url: "https://www.law.go.kr/법령/국민연금법"
    effectiveDate: "2026-10-20"
    checkedAt: 2026-11-11
    result: verified
  - item: "추납보험료 산정기준(2025.11.25 개정)"
    value: "[신청일이 속하는 달의 기준소득월액] × [납부기한이 속하는 달의 보험료율] × 추납 개월 수. 법 제92조제3항(2025.11.25 개정). 공단 예시: 기준소득월액 100만원·50개월, 9.5% 적용 시 475만원(종전 9% 450만원)"
    agency: "국민연금공단 / 국가법령정보센터 / 보건복지부"
    document: "추납 안내, 보도참고자료(2025.11.25), 국민연금법 제92조제3항"
    url: "https://www.nps.or.kr/pnsgdnc/nscvrgdata/getOHAE0002M1.do?hmpgBbsCd=BS20240145&hmpgCd=01&menuId=MN24000898&pageIndex=1&pstId=ZZ202500000000001465"
    effectiveDate: "2025-11-25"
    checkedAt: 2026-11-11
    result: verified
  - item: "연도별 보험료율(2026년 9.5%, 2027년 10%, 2028년 10.5%, 2029년 11%, 2033년 13%)"
    value: "법률 제20903호 부칙 제4조제2항: 지역·임의·임의계속가입자 2026년 1천분의 95, 2027년 1천분의 100, 2028년 1천분의 105, 2029년 1천분의 110, … 2032년 1천분의 125. 본칙 제88조제4항 1천분의 130(2033년~). 사업장가입자는 기여금·부담금 각각 절반(2026년 1만분의 475)"
    agency: "국가법령정보센터"
    document: "국민연금법 제88조, 부칙(법률 제20903호, 2025.4.2) 제4조"
    url: "https://www.law.go.kr/법령/국민연금법"
    effectiveDate: "2026-01-01"
    checkedAt: 2026-11-11
    result: verified
  - item: "임의가입자 추납보험료 상한(A값 기준)"
    value: "임의가입자 추납 연금보험료 상한 = 신청한 달 기준 A값 × 납부기한이 속하는 달의 보험료율. 2026년 A값 월 3,193,511원 → 9.5% 적용 시 월 약 303,383원(직접 계산)"
    agency: "국민연금공단 / 국가법령정보센터"
    document: "추납 안내, 국민연금법 시행령 제62조제2항"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0047M0.do"
    effectiveDate: "2026-01-01"
    checkedAt: 2026-11-11
    result: verified
  - item: "납부방법·납부기한·분할납부(60회)·분할납부이자"
    value: "일시납 또는 월 단위 최대 60회 분할. 분할 시 1년 만기 정기예금 이자율로 분할납부이자 가산. 일시납 기한은 신청한 달의 다음 달 말일, 분할은 다음 달부터 매월 말일(시행령 제62조제4항→제52조제1항 준용). 고지서는 신청한 달의 다음 달 11~15일경 발송. 미납 시 1회 안내, 체납처분 없음. 납부기한 이후 추가 가산이자"
    agency: "국민연금공단 / 국가법령정보센터"
    document: "추납 안내, 전자민원 추납보험료 납부 신청, 국민연금법 시행령 제62조·제52조"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0047M0.do"
    effectiveDate: "2026-01-01"
    checkedAt: 2026-11-11
    result: verified
  - item: "신청 방법과 필수 서류"
    value: "방문, 우편, 팩스, 정부24, 공단 홈페이지, 모바일앱, 디지털 ARS. 혼인관계증명서(상세, 주민등록번호 모두 표시) 필수(미제출 시 처리 불가, 전자가족관계등록시스템 무료 발급). 2008년 전 이혼·사별 이력은 제적등본 추가. 군복무는 병적증명서 또는 주민등록초본(병역사항 포함). 지사 담당자 유선 확인 후 확정"
    agency: "국민연금공단"
    document: "전자민원 - 추납보험료 납부 신청, 추납 안내"
    url: "https://www.nps.or.kr/elctcvlcpt/comm/getOHAC0000M5.do?menuId=MN24001072"
    effectiveDate: "2026-01-01"
    checkedAt: 2026-11-11
    result: verified
  - item: "추납 기간의 연금액 산정 기준(소득대체율 43%)과 노령연금 산식"
    value: "법 제92조제5항: 추납으로 산입되는 가입기간의 기본연금액은 추납보험료를 납부한 날이 속하는 달 기준으로 산정. 공단 보도참고자료: 소득대체율은 납부한 날이 속하는 달 기준, 2026년부터 43%. 공단 간단계산 유의사항: 연금액 = (1.29(A+B)×P21/P)×(1+0.05n/12)×지급률, 가입기간 10년 지급률 50%(1개월마다 5/12% 증가), 2026년 A값 3,193,511원"
    agency: "국가법령정보센터 / 국민연금공단"
    document: "국민연금법 제92조제5항, 보도참고자료(2025.11.25), 예상연금 간단계산 유의사항"
    url: "https://www.nps.or.kr/comm/quick/getOHAH0011P0.do?menuId=MN24001118"
    effectiveDate: "2026-01-01"
    checkedAt: 2026-11-11
    result: verified
  - item: "공단 예상연금 간단계산 조회값(10년 가입 예상 월 연금)"
    value: "2026-11-11 직접 조회. 월 보험료 95,000원(소득기준 100만원): 10년 225,400원·15년 338,100원·20년 450,800원 / 190,000원(200만원): 10년 279,150원·15년 418,720원·20년 558,300원 / 303,380원(319만원): 10년 343,110원·15년 514,670원·20년 686,220원. 공단 표기 가정: 2026년 1월 최초 가입, 2026년 A값 기준"
    agency: "국민연금공단"
    document: "예상연금 간단계산"
    url: "https://www.nps.or.kr/comm/quick/getOHAH0011P0.do?menuId=MN24001118"
    effectiveDate: "2026-01-01"
    checkedAt: 2026-11-11
    result: verified
  - item: "본문 가정 사례의 월 연금 증가액·회수 기간(300만·500만·1,000만원)"
    value: "공단 조회값(10년 가입 예상월액)을 120개월로 나눈 1개월당 증가액(100만원 1,878.3원, 200만원 2,326.3원, 319만원 2,859.3원)에 추납 개월 수를 곱한 직접 계산. 12개월 증가 22,540원/27,915원/34,311원, 회수 기간 50.6/81.7/106.0개월. 300만: 31개월 58,228원·15개월 34,894원·9개월 25,733원 / 500만: 52개월 97,673원·26개월 60,483원·16개월 45,748원 / 1,000만: 105개월 197,225원·52개월 120,965원·32개월 91,496원. '2026년 최초 가입' 가정이라 과거 가입 이력(평균소득 B값, 2025년 이전 기간의 다른 비례상수)이 있는 실제 가입자와 다름. 공단의 개인별 추납 예상연금과 대조하지 않음 → 본문에 가정 사례·공단 확인 명시"
    agency: "국민연금공단"
    document: "예상연금 간단계산(조회값 기준 직접 계산)"
    url: "https://www.nps.or.kr/comm/quick/getOHAH0011P0.do?menuId=MN24001118"
    effectiveDate: "2026-01-01"
    checkedAt: 2026-11-11
    result: partial
  - item: "2026년 12월 신청 시 보험료율 10% 적용(11월 신청 9.5%)"
    value: "법 제92조제3항(납부기한이 속하는 달의 연금보험료)과 납부기한(신청한 달의 다음 달 말일), 2027년 보험료율 10%를 그대로 적용한 결과. 공단은 2025년 12월 신청→2026년 1월 납부기한 사례(9.5% 적용)만 안내했고 2026년 12월 사례를 직접 안내한 자료는 확인하지 못함 → 본문에 '공단·고지서 확인' 명시"
    agency: "국가법령정보센터 / 국민연금공단"
    document: "국민연금법 제92조제3항, 부칙 제4조, 보도참고자료(2025.11.25)"
    url: "https://www.law.go.kr/법령/국민연금법"
    effectiveDate: "2025-11-25"
    checkedAt: 2026-11-11
    result: partial
  - item: "분할납부 시 회차별 보험료율 적용 방식"
    value: "분할납부는 회차마다 납부기한(매월 말일)이 따로 있어 해가 바뀌면 오른 보험료율이 적용될 가능성이 있으나, 공단 공식 안내에서 회차별 적용 방식을 확인하지 못함 → 본문에서 '공단에서 회차별 금액 확인'으로 한정"
    agency: "국민연금공단"
    document: "추납 안내(해당 내용 명시 없음)"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0047M0.do"
    effectiveDate: "2026-01-01"
    checkedAt: 2026-11-11
    result: partial
  - item: "직장가입자 추납보험료의 회사 부담 여부, 추납보험료 소득공제"
    value: "직장가입자 추납보험료를 본인이 전액 부담하는지 공단 추납 안내·법 제92조에 명시가 없어 본문에서 '공단 확인'으로 한정. 소득공제는 공단 연금보험료 안내에 '추납보험료 포함'으로 소개된 것을 검색 결과로만 확인(원문 페이지 직접 확인 못 함) → 본문에 방법·한도는 확인 필요로 기재"
    agency: "국민연금공단"
    document: "연금보험료 안내(연금보험에 대한 소득공제)"
