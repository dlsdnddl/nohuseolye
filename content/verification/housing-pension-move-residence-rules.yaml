  - item: "이사 시 월지급금 증감 원칙, 예비승인 1개월, 가격평가 순서"
    value: "기존가=신규가 동일, 신규 더 크면 증가(초기보증료 추가), 기존 더 크면 차액으로 잔액 상환(잔액≥차액 동일, 잔액<차액 감소). 예비승인 신청일부터 1개월 이내, 평가순서 부동산원→KB→공시가격→감정평가"
    agency: "법제처 생활법령정보"
    document: "주택연금 - 담보주택 변경"
    url: "https://easylaw.go.kr/CSP/CnpClsMain.laf?popMenu=ov&csmSeq=730&ccfNo=3&cciNo=2&cnpClsNo=3"
    effectiveDate: "2026-10-15"
    checkedAt: 2026-11-06
    result: verified
  - item: "임대 가능 여부(저당권 vs 신탁)"
    value: "원칙 금지, 공사 동의 후 가능, 보증금 없는 월세 일부임대는 동의 불필요. 저당권방식은 보증금 없는 임대만, 신탁방식은 보증금 있는 임대도 가능"
    agency: "한국주택금융공사"
    document: "주택연금 상품 소개"
    url: "https://www.hf.go.kr/ko/sub03/sub03_01_01_01.do"
