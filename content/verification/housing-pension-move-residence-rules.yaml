  - item: "신규 주택 요건(소유·거주·권리관계·가격)"
    value: "신청인 단독/배우자 공동 소유, 거주, 소유권 침해·제한물권·보증금 임대차 없음(대출실행일까지 해소 가능), 재건축 진행 아님, 등기 완료, 신규 공시가격 12억 이하 또는 기존 이하(재건축·재난 예외)"
