  - item: "출생연도별 지급개시연령(1969년생 이후 노령연금 65세, 조기 60세)"
    value: "노령연금 지급연령 상향조정(법률 제8541호 부칙 제8조): 1961-64년생 63세/58세, 1965-68년생 64세/59세, 1969년생 이후 65세/60세. 가입기간 10년 이상이면 지급개시연령 이후 평생 지급"
    agency: "국민연금공단"
