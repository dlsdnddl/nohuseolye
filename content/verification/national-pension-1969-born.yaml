  - item: "지급 시작 달과 지급일, 1969년생 생월별 첫 지급 달 표"
    value: "국민연금법 제54조: 지급 사유가 생긴 날이 속하는 달의 다음 달부터 지급, 매월 25일(토요일·공휴일이면 전날). 이를 1969년생의 만 65세 도달 월(2034년 1~12월)에 적용한 직접 계산: 1월생 2034년 2월분 … 12월생 2035년 1월분"
    agency: "국가법령정보센터"
    document: "국민연금법 제54조"
    url: "https://www.law.go.kr/법령/국민연금법"
