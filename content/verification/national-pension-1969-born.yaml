  - item: "연기연금(최대 5년, 연 7.2%)"
    value: "지급개시연령 도달일로부터 최대 5년 연기 가능, 연기비율 50~90%·전부, 매 1년당 7.2%(월 0.6%) 가산. 연금소득세·건강보험료·기초연금액에 영향 가능. 1969년생 최대 만 70세(2039년). 금액표는 100만원 가정 직접 계산"
    agency: "국민연금공단"
