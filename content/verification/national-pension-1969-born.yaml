  - item: "조기노령연금 요건과 소득 있는 업무 기준"
    value: "가입기간 10년 이상, 출생연도별 조기노령연금 지급개시연령 이상, 소득이 있는 업무에 종사하지 않는 경우 본인 신청으로 지급(법 제61조제2항). 소득이 있는 업무(시행령 제45조): 월평균소득금액(근로소득금액+사업소득금액, 종사 개월수로 나눔)이 A값(2026년 3,193,511원)보다 많은 경우"
    agency: "국민연금공단"
    document: "노령연금 안내 — 조기노령연금, 소득이 있는 업무"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-17
    result: verified
  - item: "조기 수령 중 소득 발생 시 지급 정지, 지급정지 신청"
    value: "노령연금 지급개시 연령 전에 소득이 있는 업무에 종사하면 그 기간 동안 지급 정지. 소득 있는 업무 종사·중단 시 공단 신고. 법 제66조제1항제2호: 소득이 없는 상태에서 지급 정지 신청 가능, 다시 가입대상이 되어 보험료 납부 가능, 재지급 시 늘어난 가입기간 합산해 재산정"
    agency: "국민연금공단"
    document: "노령연금 안내 — 조기노령연금, 조기노령연금 지급정지신청"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
