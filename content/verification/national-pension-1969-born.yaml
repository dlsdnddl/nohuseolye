  - item: "조기노령연금 연령별 지급률(1969년생, 조기 60세 기준 적용)"
    value: "공단 예시 '1966년생(조기노령연금 지급개시연령 59세)의 경우': 청구당시 연령 59세 70%, 60세 76%, 61세 82%, 62세 88%, 63세 94%. 공단 예시는 1966년생(59세 기준)뿐. 1969년생(조기 지급개시 60세)에 같은 구조(1년당 6%포인트)를 적용한 60세 70%~64세 94%는 직접 적용 → 본문에 같은 구조·공단 확인 표기"
    agency: "국민연금공단"
    document: "노령연금 안내 — 조기노령연금 연령별 지급률 예시"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
