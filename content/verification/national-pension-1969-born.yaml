  - item: "의무 가입 종료(60세)와 임의계속가입(65세까지)"
    value: "국민연금법 제12조: 60세가 된 날의 다음 날에 자격 상실. 제13조: 65세가 될 때까지 신청하면 임의계속가입자가 될 수 있음. 1969년생은 2029년에 만 60세"
    agency: "국가법령정보센터"
    document: "국민연금법 제12조, 제13조"
