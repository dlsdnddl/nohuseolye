  - item: "조기노령연금 연령별 지급률(1971년생, 조기 60세 기준 적용)"
    value: "공단 예시는 1966년생(조기 59세 기준) 59세 70%~63세 94%뿐. 1971년생(조기 60세)에 같은 구조(1년당 6%포인트)를 적용한 60세 70%~64세 94%는 직접 적용 → 본문에 같은 구조·공단 확인 표기"
