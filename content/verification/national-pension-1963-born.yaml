  - item: "지급 시작 달과 지급일, 1963년생 생월별 첫 지급 달 표"
    value: "국민연금법 제54조: 지급 사유가 생긴 날이 속하는 달의 다음 달부터 지급, 매월 25일(토요일·공휴일이면 전날). 1963년생의 만 63세 도달 월(2026년 1~12월)에 적용한 직접 계산: 1월생 2026년 2월분 … 11월생 2026년 12월분, 12월생 2027년 1월분"
    agency: "국가법령정보센터"
    document: "국민연금법 제54조"
    url: "https://www.law.go.kr/법령/국민연금법"
    effectiveDate: "2026-10-20"
    checkedAt: 2026-11-16
    result: verified
  - item: "늦게 청구할 때 소급 지급과 시효 5년, 본인 청구, 처리기간"
    value: "국민연금법 제115조: 급여를 받을 권리는 5년간 행사하지 않으면 시효로 소멸. 공단 청구방법: 본인 청구 원칙, 처리기간 30일 이내, 최근 5년 이내 급여분 지급. 소급분 이자 여부는 확인하지 않아 본문에 쓰지 않음. 본문 예시(2026년 3월분 → 2027년 3월 청구 시 1년치)는 직접 예시"
    agency: "국가법령정보센터 / 국민연금공단"
    document: "국민연금법 제115조, 노령연금 안내 — 청구방법"
    url: "https://www.law.go.kr/법령/국민연금법"
    effectiveDate: "2026-10-20"
    checkedAt: 2026-11-18
    result: verified
  - item: "연기연금(수급권 취득 이후 지급개시연령 도달일부터 5년까지, 연 7.2%, 일부 연기)"
    value: "공단: 노령연금 수급자가 희망하는 경우 연금 수급권을 취득한 이후부터 출생연도별 지급개시연령 도달일로부터 5년이 될 때까지(최대 5년) 전부 또는 일부 연기 신청 가능. 연기비율 50·60·70·80·90%·전부. 연기 전 원래 노령연금액(부양가족연금액 제외)에 매 1년당 7.2%(월 0.6%) 가산. 연금소득세·건강보험료·기초연금액 영향 가능. 1963년생 최대 만 68세(2031년). 금액표는 100만원 가정 직접 계산"
    agency: "국민연금공단"
    document: "노령연금 안내 — 연기제도(법 제62조)"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-18
    result: verified
  - item: "소득활동에 따른 노령연금 감액(지급개시연령부터 5년, A값+200만원)"
    value: "2015.7.29. 이후 수급권 취득자: 지급개시연령부터 5년 동안 월평균소득금액이 A값+200만원(2026년 519만원) 이상이면 소득구간별 감액, 부양가족연금액 미지급, 감액한도 노령연금의 1/2. 월평균소득금액은 사업소득금액(부동산임대소득 포함)+근로소득금액을 종사 개월 수로 나눈 금액. A값 2026년 3,193,511원. 지급연령 도달일로부터 5년 이내 소득활동 중단 시 감액되지 않은 연금액. 1963년생 2026~2031년"
    agency: "국민연금공단"
    document: "노령연금 안내 — 소득활동에 따른 노령연금액(법 제63조의2)"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-18
    result: verified
  - item: "이미 조기노령연금을 받는 1963년생의 만 63세 이후"
    value: "공단: 조기노령연금은 처음 연금을 받는 연령에 따른 지급률로 평생 지급, 노령연금 지급개시 연령 전에 소득 있는 업무 종사 시 지급 정지, 지급개시 연령부터 5년 동안은 소득구간별 감액 적용. 이를 1963년생에 연결한 해석 → 본문에 공단(1355) 확인 표기"
    agency: "국민연금공단"
