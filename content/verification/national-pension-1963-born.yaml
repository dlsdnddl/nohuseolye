  - item: "임의계속가입(65세까지)과 추납(가입 중에만, 수급 개시 후 불가)"
    value: "국민연금법 제13조: 65세가 될 때까지 신청하면 임의계속가입자가 될 수 있음(1963년생 2028년). 추납 조건은 national-pension-additional-payment 검증(2026-11-11) 내용을 따름. 가입기간 10년 미만인 분의 사례로 한정해 안내"
    agency: "국가법령정보센터"
