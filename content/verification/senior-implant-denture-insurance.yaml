  - item: "틀니 대상·종류·시행일·주기"
    value: "만 65세 이상. 완전틀니 레진상 2012.7.1·금속상 2015.7.1, 부분틀니 2013.7.1(클라스프 유지형 금속상). 1악당 7년에 1회, 구강상태 심각 변화 시 의학적 소견 있으면 추가 1회. 어태치먼트·텔레스코픽·임플란트 피개의치 등 특수 틀니 제외"
