  - item: "임플란트 진료 단계·재시술·유지관리·기관 이동"
    value: "3단계(진단·치료계획, 고정체 식립, 보철수복). 골유착 실패 시 2단계 재시술 1회(수가 50%). 보철 장착 후 3개월 이내 진찰료만, 3개월 초과 유지관리 비급여. 1단계 시작 후 다른 요양기관 이동 불가(중단 시 진행 단계까지 비용). 부분틀니와 중복급여 허용"
    agency: "국민건강보험공단"
