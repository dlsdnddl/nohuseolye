  - item: "2027년 1월 완전 무치악 임플란트 지원 확대(의결, 시행 전)"
    value: "2026.9.8 제15차 건정심 의결: 2027.1월부터 치아가 없는 만 65세 이상도 임플란트 2개 지원(약 7만 명, 1인당 약 228만 원 지원 예상). 기존 건강보험 완전틀니 수혜 완전 무치악 환자는 틀니 지원 후 7년 경과 후부터. 현재(2026.11)는 시행 전이므로 본문에서 '현재 제외 / 2027.1 확대 예정'으로 구분, 세부 고시 기준은 단정하지 않음"
    agency: "보건복지부"
    document: "건강보험 보장 수준 높아진다(2026.9.8 보도자료, 건강보험 보장 1단계 혁신방안)"
    url: "https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1491824&tag=&nPage=1"
    effectiveDate: "2027-01-01"
    checkedAt: 2026-11-08
    result: verified
  - item: "임플란트 본인부담상한제 제외 문구의 2027 이후 유지 여부"
    value: "공단 Q&A는 임플란트 본인부담상한제 미적용이라고 안내. 2027 확대 후 변경 여부는 확인되지 않아 본문은 '공단 안내 기준'으로만 서술하고 단정하지 않음(본문 '다루지 않는 것'에 상한제 한도액 제외)"
    agency: "국민건강보험공단"
    document: "임플란트 안내 / 틀니 Q&A"
    url: "https://www.nhis.or.kr/static/html/wbma/c/wbmac0221.html"
