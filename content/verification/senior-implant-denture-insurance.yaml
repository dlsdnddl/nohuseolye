  - item: "2026년 현재 적용 여부(고시 개정·수가 변경)"
    value: "NHIS 안내 페이지는 상시 게시 중이나, Q&A PDF의 작성 연도는 확인하지 못함(금액 예시가 2018년 자료). 2026년 개정 여부는 공식 문서로 개별 확인하지 못해 본문에 '시술 전 공단·치과에서 최신 기준 확인' 안내 병기"
    agency: "국민건강보험공단"
