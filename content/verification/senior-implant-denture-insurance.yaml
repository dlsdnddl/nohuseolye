  - item: "틀니 진료 단계·재제작·유지관리·무상보상"
    value: "완전 1~5단계, 부분 1~6단계. 환자 귀책 분실·파손 재제작 비급여, 일부 파절 수리 급여. 유지관리 급여(첨상 연 1회 등 항목별 연간 횟수 제한), 본인부담 30%(차상위 5%/15%, 의료급여 1종 5%/2종 15%). 무상 사후점검 장착 후 3개월 이내 최대 6회(진찰료만)"
