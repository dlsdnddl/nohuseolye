  - item: "임플란트 급여 재료와 급여 제외 사례(지르코니아 급여 반영)"
    value: "급여: 분리형 식립재료 + 보철재료 PFM crown 또는 지르코니아 crown(복지부 고시 제2025-23호, 2025.2.1 시행). 급여 제외: 관골 식립, 일체형 식립재료 등 공단 안내 사례, 부가수술(골이식·상악동거상술)·맞춤형 지대주는 비급여. 공단 안내 페이지·Q&A PDF는 PFM만 급여로 적혀 있어 복지부 발표를 우선 적용"
    agency: "보건복지부"
    document: "치과 임플란트 보철재료 확대 및 치아 우식검사 급여 확대(2024 제25차 건정심 보도자료) / 고시 제2025-23호 치협 안내"
    url: "https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1484121&tag=&nPage=1"
