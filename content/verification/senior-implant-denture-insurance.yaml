  - item: "사전등록(치과가 요양기관정보마당으로 등록, 의료급여는 관할 시·군·구)"
    value: "치과 병·의원이 사전등록 신청(환자 대행). 의료급여 수급권자는 관할 시·군·구에서만 가능"
