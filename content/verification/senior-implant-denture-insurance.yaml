  - item: "임플란트 급여 재료와 전체 비급여 사례"
    value: "급여: 분리형 식립재료 + PFM crown. 시술 전체 비급여: 완전 무치악, 관골 식립, 일체형 식립재료, PFM 이외 보철재료(지르코니아·금·메탈 등). 부가수술(골이식·상악동거상술)·맞춤형 지대주는 비급여"
