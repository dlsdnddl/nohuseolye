    value: "법 제61조제2항: 가입기간 10년 이상, 조기 지급개시연령 이상, 소득 있는 업무 미종사 시 본인 신청. 시행령 제45조: 월평균소득금액이 A값(2026년 3,193,511원) 초과. 지급개시 연령 전 소득 있는 업무 종사 기간 지급 정지(공단 안내, 1969년생 글 2026-11-17 확인과 같은 페이지)"
