    effectiveDate: "2026-07-01"
    checkedAt: 2026-11-18
    result: verified
  - item: "연금외수령(중도 해지 등) 기타소득세 15%"
    value: "소득세법 제21조제1항제21호: 세액공제받은 납입액·운용수익을 연금외수령한 소득은 기타소득. 제129조제1항제6호나목: 제21조제1항제21호 기타소득 100분의 15. 지방소득세 포함 16.5%는 직접 계산"
