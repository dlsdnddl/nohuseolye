rows:
  - item: "연금계좌 세액공제 한도(연금저축 600만원, 퇴직연금계좌 합산 900만원)"
    value: "소득세법 제59조의3제1항 단서: 연금저축계좌 납입액이 연 600만원 초과 시 초과분 없는 것으로, 연금저축 600만원 이내 금액과 퇴직연금계좌 납입액 합계가 연 900만원 초과 시 초과분 없는 것으로 함. 퇴직소득 등 과세이연 소득, 계좌 이전 납입액 제외"
    agency: "국가법령정보센터"
    document: "소득세법 제59조의3(연금계좌세액공제) [시행 2026.7.1.]"
    url: "https://www.law.go.kr/법령/소득세법/제59조의3"
    effectiveDate: "2026-07-01"
    checkedAt: 2026-11-18
    result: verified
  - item: "공제율(12%, 소득 기준 이하 15%)"
    value: "소득세법 제59조의3제1항: 연금계좌 납입액의 100분의 12. 종합소득금액 4천500만원 이하(근로소득만 있는 경우 총급여액 5천500만원 이하)는 100분의 15"
    agency: "국가법령정보센터"
    document: "소득세법 제59조의3제1항"
    url: "https://www.law.go.kr/법령/소득세법/제59조의3"
    effectiveDate: "2026-07-01"
    checkedAt: 2026-11-18
    result: verified
  - item: "지방소득세 포함 16.5%·13.2%와 금액표(300·600·900만원, 남은 금액 예시)"
    value: "15%·12%에 지방소득세(소득세의 10%)를 더한 직접 계산: 900만원 × 16.5% = 1,485,000원, × 13.2% = 1,188,000원. 지방세법 원문은 이번에 확인하지 않음. 예시(360만원 납입 → 540만원 추가 시 891,000원)는 직접 계산"
    agency: "국가법령정보센터"
    document: "소득세법 제59조의3 기준 직접 계산"
    url: "https://www.law.go.kr/법령/소득세법/제59조의3"
    effectiveDate: "2026-07-01"
    checkedAt: 2026-11-18
    result: partial
  - item: "ISA 만기 전환금액 추가 공제(10%, 최대 300만원)"
    value: "소득세법 제59조의3제3항·제4항: 개인종합자산관리계좌 만기 후 연금계좌 납입액(전환금액)을 납입 과세기간 연금계좌 납입액에 포함, 전환금액의 100분의 10 또는 300만원 중 적은 금액을 한도에 더함"
    agency: "국가법령정보센터"
    document: "소득세법 제59조의3제3항·제4항"
    url: "https://www.law.go.kr/법령/소득세법/제59조의3"
    effectiveDate: "2026-07-01"
    checkedAt: 2026-11-18
    result: verified
  - item: "납입 한도 연 1,800만원, 지난 과세기간분 납입 불가, 연금수령 개시 신청 후 납입 불가"
    value: "소득세법 시행령 제40조의2제2항: 연간 1천800만원(+전환금액 등) 이내 납입, 해당 과세기간 이전의 연금보험료는 납입 불가(보험계약 예외), 연금수령 개시를 신청한 날 이후에는 연금보험료를 납입하지 않을 것. 과세기간은 1월 1일~12월 31일 → 2026년분은 12월 31일 납입분까지"
    agency: "국가법령정보센터"
    document: "소득세법 시행령 제40조의2제2항 [시행 2026.10.1.]"
    url: "https://www.law.go.kr/법령/소득세법시행령/제40조의2"
    effectiveDate: "2026-10-01"
    checkedAt: 2026-11-18
    result: verified
  - item: "연금수령 요건(55세 이후 개시 신청, 가입 5년 경과, 연금수령한도)"
    value: "소득세법 시행령 제40조의2제3항: 가입자가 55세 이후 연금수령 개시 신청 후 인출, 가입일부터 5년 경과 후 인출(이연퇴직소득이 있는 경우 제외), 연금수령한도 이내 인출. 본문 예시(58세 가입 → 63세 이후)는 직접 적용"
    agency: "국가법령정보센터"
    document: "소득세법 시행령 제40조의2제3항"
    url: "https://www.law.go.kr/법령/소득세법시행령/제40조의2"
    effectiveDate: "2026-10-01"
    checkedAt: 2026-11-18
    result: verified
  - item: "연금수령 시 세율(5·4·3%), 종신계약 3%, 분리과세 1,500만원, 과세 대상"
    value: "소득세법 제129조제1항제5호의2: 연금수령일 현재 70세 미만 100분의 5, 70세 이상 80세 미만 100분의 4, 80세 이상 100분의 3, 종신계약 100분의 3(낮은 세율 적용). 제14조제3항제9호다목: 연금소득 합계액 연 1천500만원 이하면 분리과세연금소득. 제20조의3: 과세 대상은 세액공제받은 납입액과 운용수익. 지방소득세 포함 5.5·4.4·3.3%는 직접 계산"
    agency: "국가법령정보센터"
    document: "소득세법 제129조, 제14조, 제20조의3"
