rows:
  - item: "출생연도별 지급개시연령(1965~68년생 노령연금 64세, 조기 59세)"
    value: "노령연금 지급연령 상향조정(법률 제8541호 부칙 제8조): 1961-64년생 63세/58세, 1965-68년생 64세/59세, 1969년생 이후 65세/60세. 가입기간 10년 이상이면 지급개시연령 이후 평생 지급"
    agency: "국민연금공단"
    document: "노령연금 안내 — 노령연금의 종류"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-16
    result: verified
  - item: "조기노령연금 연령별 지급률(지급개시연령 59세 기준)"
    value: "공단 예시 '1966년생(조기노령연금 지급개시연령 59세)의 경우': 59세 70%, 60세 76%, 61세 82%, 62세 88%, 63세 94%. 1968년생도 같은 연령 구간(1965~68년생, 조기 지급개시 59세)이라 같은 지급률 적용"
    agency: "국민연금공단"
    document: "노령연금 안내 — 조기노령연금 연령별 지급률 예시"
