    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-16
    result: verified
  - item: "조기노령연금 요건과 소득 있는 업무 기준"
    value: "가입기간 10년 이상, 조기노령연금 지급개시연령 이상, 소득이 있는 업무에 종사하지 않는 경우 본인 신청으로 지급(법 제61조제2항). 소득이 있는 업무(시행령 제45조): 월평균소득금액이 A값(2026년 3,193,511원)보다 많은 경우"
    agency: "국민연금공단"
    document: "노령연금 안내 — 조기노령연금, 소득이 있는 업무"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-16
    result: verified
  - item: "조기 수령 중 소득 발생 시 지급 정지, 지급정지 신청, 지급개시연령 이후 5년 감액"
    value: "노령연금 지급개시 연령 전에 소득이 있는 업무에 종사하면 그 기간 동안 지급 정지, 공단 신고. 법 제66조제1항제2호 지급 정지 신청 시 다시 가입대상, 재지급 시 늘어난 가입기간 합산 재산정. 지급개시 연령부터 5년 동안은 소득구간별 감액 적용"
    agency: "국민연금공단"
    document: "노령연금 안내 — 조기노령연금, 조기노령연금 지급정지신청"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-16
    result: verified
  - item: "지급 시작 달과 지급일, 1968년생 생월별 첫 지급 달 표"
    value: "국민연금법 제54조: 지급 사유가 생긴 날이 속하는 달의 다음 달부터 지급, 매월 25일(토요일·공휴일이면 전날). 이를 1968년생의 만 64세 도달 월(2032년 1~12월)에 적용한 직접 계산: 1월생 2032년 2월분 … 12월생 2033년 1월분"
    agency: "국가법령정보센터"
    document: "국민연금법 제54조"
    url: "https://www.law.go.kr/법령/국민연금법"
    effectiveDate: "2026-10-20"
    checkedAt: 2026-11-16
    result: verified
  - item: "의무 가입 종료(60세)와 임의계속가입(65세까지)"
    value: "국민연금법 제12조: 60세가 된 날의 다음 날에 자격 상실. 제13조: 65세가 될 때까지 신청하면 임의계속가입자가 될 수 있음. 1968년생은 2028년에 만 60세"
    agency: "국가법령정보센터"
    document: "국민연금법 제12조, 제13조"
    url: "https://www.law.go.kr/법령/국민연금법"
    effectiveDate: "2026-10-20"
    checkedAt: 2026-11-16
    result: verified
  - item: "연기연금(최대 5년, 연 7.2%)"
    value: "지급개시연령 도달일로부터 최대 5년 연기 가능, 매 1년당 7.2%(월 0.6%) 가산. 1968년생 최대 만 69세(2037년). 금액표는 100만원 가정 직접 계산"
    agency: "국민연금공단"
