  - item: "A값 기준 근로소득 총급여 환산(약 5,060만원)"
    value: "직접 계산: A값 3,193,511원×12 = 38,322,132원(근로소득금액). 총급여 4,500만~1억 구간 근로소득공제 1,200만원+(총급여−4,500만원)×5% 적용 시 총급여 50,602,244원. 같은 식으로 공단 표의 519만원 기준 총급여 75,865,403원이 재현됨. 공단이 A값 기준 총급여를 직접 안내한 것은 아님 → 본문에 계산값·공단 확인 표기. 기존 글의 5,062만원을 고침"
    agency: "국민연금공단"
    document: "노령연금 안내 — 소득구간별 감액현황 표(계산 방식 대조용)"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-16
    result: partial
  - item: "조기수령 청구 가능 시점과 첫 지급 달"
    value: "만 59세가 되면 청구 가능하다는 점은 공단 안내로 확인. 조기노령연금의 지급 사유 발생일(청구일 기준인지)을 조문으로 확정하지 못함 → 본문은 '원칙적으로 다음 달분부터, 정확한 달은 공단 확인'으로 서술"
    agency: "국민연금공단 / 국가법령정보센터"
    document: "노령연금 안내 — 조기노령연금, 국민연금법 제54조"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-16
    result: partial
  - item: "손익분기점(누적 수령액이 같아지는 시점)"
    value: "지급률만으로 한 직접 계산. 59세 70%: 4,200÷30=140개월 → 만 75세 8개월. 60세 76%: 3,648÷24=152개월 → 만 76세 8개월. 61세 82%: 2,952÷18=164개월 → 만 77세 8개월. 물가·세금·건강보험료 미반영 → 본문에 단순 계산으로 명시"
    agency: "국민연금공단"
    document: "조기노령연금 지급률 기준 직접 계산"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
