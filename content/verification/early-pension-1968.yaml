  - item: "청구 방법·서류·처리기간"
    value: "본인 청구 원칙, 전국 지사·홈페이지·모바일·정부24·우편·팩스. 신분증, 예금계좌, 혼인관계증명서 상세(공단 자료로 갈음 가능). 처리기간 30일 이내"
