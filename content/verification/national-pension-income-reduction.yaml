    result: verified
  - item: "소득 구간별 감액 계산식(3개 구간)과 감액 한도"
    value: "200만~300만 미만 15만원+(200만 초과분×15%), 300만~400만 미만 30만원+(300만 초과분×20%), 400만 이상 50만원+(400만 초과분×25%). 감액한도 노령연금의 1/2. 구간 경계는 A값 초과분 기준"
    agency: "국민연금공단"
