  - item: "5년 한시 감액, 소득 활동 중단 시 감액 없음, 소득 신고 의무"
    value: "2015.7.29 이후 수급권 취득자는 지급개시연령부터 5년간 감액. 소득 있는 업무 종사·종료 시 공단 신고 필요"
    agency: "국민연금공단"
    document: "노령연금 안내"
