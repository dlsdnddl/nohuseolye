  - item: "개정법 시행일(2026.6.17)과 2025년 소득분부터 소급 적용, 자동 환급"
    value: "2026.6.17 시행. 2025년 소득분부터 적용(2025 A값 308만 9,062원 + 200만원 미만 감액 없음), 7월 말부터 신청 없이 자동 환급, 부양가족연금도 함께 지급. 2026년 소득은 1월부터 상향 기준 적용"
    agency: "보건복지부"
    document: "노령연금 소득 감액 기준 완화 개정 시행 보도자료"
    url: "https://www.bokjiro.go.kr/ssis-tbu/cms/pc/news/news/1309933_1114.html"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-10
    result: verified
  - item: "조기노령연금 소득 있는 업무 종사 시 지급 정지 및 개시연령 이후 5년간 감액표 적용"
    value: "소득 있는 업무(A값 초과) 종사 시 조기노령연금 지급 정지. 노령연금 개시연령 이후 5년간은 감액 구간표 적용"
    agency: "국민연금공단"
    document: "노령연금 안내(조기노령연금)"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-10
    result: verified
  - item: "연기연금(최대 5년, 연 7.2% 가산)과 출생연도별 지급개시연령"
    value: "연기 최대 5년, 연 7.2%(월 0.6%) 가산, 연기비율 50%~전부. 1953~56 61세 / 1957~60 62세 / 1961~64 63세 / 1965~68 64세 / 1969~ 65세, 조기 56~60세"
    agency: "국민연금공단"
    document: "노령연금 안내"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-10
    result: verified
  - item: "감액 기준은 월급이 아닌 '월평균소득금액'(근로소득금액+사업소득금액÷종사 개월수)"
    value: "월평균소득금액 = (근로소득금액 + 사업소득금액(부동산임대 포함)) ÷ 종사 개월수. 근로소득금액 = 총급여 − 근로소득공제, 사업소득금액 = 총수입금액 − 필요경비. 2026년 기준 A값 3,193,511원 + 200만원(519만원) 이상이면 감액 대상"
    agency: "국민연금공단"
    document: "노령연금 안내(소득 있는 업무·월평균소득금액 산정)"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-10
    result: verified
  - item: "2025년 소득분(508만 9,062원 미만 감액 없음)과 2026년 소득분(519만 3,511원)의 구분"
    value: "2025년 A값 308만 9,062원 + 200만원 = 508만 9,062원 미만이면 감액 없음(2025년 소득분 소급 적용, 7월 말부터 자동 환급·과세자료 직접 제출 가능). 2026년 소득은 1월부터 상향 기준 적용. 2025년 소득 508만 9,062원 이상인 경우의 구체 감액액은 공단 산정에 따름(본문에 금액 미제시)"
    agency: "보건복지부"
    document: "노령연금 소득 감액 기준 완화 개정 시행 보도자료(2026.6.16 정책브리핑 게재)"
    url: "https://www.bokjiro.go.kr/ssis-tbu/cms/pc/news/news/1309933_1114.html"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-10
    result: verified
  - item: "근로소득만 있는 경우 환산 총급여 재검증(소득세법 근로소득공제 적용)"
    value: "공단 표의 총급여 75,865,403원/88,496,982원/101,094,013원에 소득세법상 근로소득공제(1천만원 구간별)를 적용해 12개월로 나누면 월평균소득금액 5,193,511원/6,193,511원/7,193,511원으로 1원 이내 일치(2026-11-10 직접 재계산). 월 급여 환산 6,322,117원/7,374,749원/8,424,502원은 공단 표 그대로"
    agency: "국민연금공단"
    document: "노령연금 안내(근로소득만 있는 경우 총급여 기준) + 직접 재계산"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-10
    result: verified
  - item: "본문 가정 사례의 감액액(월평균소득금액 600만원 약 27만 1천원, 700만원 한도 적용 40만원, 월급 650만원 약 17만 5천원, 750만원 약 32만 4천원)"
    value: "공단 구간 계산식·감액한도(연금의 1/2)를 직접 대입해 2026-11-10 재계산한 값(600만원→270,973원, 700만원→461,298원이나 연금 80만원의 1/2=40만원 한도, 월급 650만원→소득금액 5,362,500원→175,348원, 750만원→6,312,500원→323,798원). 공단 모의계산 결과와 대조하지는 않았으며 본문에 '가정 사례·실제는 공단 산정 기준'으로 명시"
    agency: "국민연금공단"
    document: "노령연금 안내(구간 계산식 기준 직접 계산)"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-10
    result: partial
  - item: "조기노령연금 지급정지 기준(A값 초과)과 2026.6.17 완화의 적용 여부"
    value: "공단 안내는 월평균소득금액이 A값보다 많으면 '소득이 있는 업무'에 종사하는 것으로 보며 조기노령연금 지급정지·수급권 인정에 영향. 이번 519만원 상향이 조기노령연금 정지 기준에도 적용되는지는 공단 안내에 명시가 없어 본문에서 '공단 확인 필요'로 한정"
    agency: "국민연금공단"
    document: "노령연금 안내(소득이 있는 업무)"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
