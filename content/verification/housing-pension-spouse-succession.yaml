  - item: "세대이음 주택연금(2026.6.1~) 개요"
    value: "55세 이상 자녀가 동일 주택으로 가입, 인출한도(대출한도의 50% 초과 90% 이하) 내 목돈으로 부모 채무 상환, 부모는 근저당권방식 한정, 채무가 잔존가치보다 큰 경우 등 가입 불가"
