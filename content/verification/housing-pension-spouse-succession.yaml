  - item: "상속인 선택지(임의매각·직접상환), 담보주택 가격과 대출잔액 중 적은 금액 상환, 승인 시 최대 3년"
    value: "임의매각은 공사 동의·협의 후 일정 기간 내 처분, 적은 금액 상환, 물적담보 충분 승인 시 최대 3년. 직접 상환 시 주택은 상속인에게. 신탁방식 비귀속 상속인 상환 시에도 소유권은 귀속권리자에게"
