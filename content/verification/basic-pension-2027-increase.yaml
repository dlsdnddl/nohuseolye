    value: "2027년 예산안은 국회 심의 중이며 시정연설에서 법정기한 12월 2일 처리를 요청. 기초연금법 일부개정법률안(이인영의원 등 10인)은 2026-10-26 발의되어 보건복지위원회에 계류. 2026-10-01 본회의 통과분은 국내 5년 거주요건 신설 건으로 차등지급과 별개"
