rows:
  - item: "출생연도별 지급개시연령(1961~64년생 노령연금 63세, 조기 58세)"
    value: "노령연금 지급연령 상향조정(법률 제8541호 부칙 제8조): 1953-56년생 61세/56세, 1957-60년생 62세/57세, 1961-64년생 63세/58세, 1965-68년생 64세/59세, 1969년생 이후 65세/60세. 가입기간 10년 이상이면 지급개시연령 이후 평생 지급"
    agency: "국민연금공단"
    document: "노령연금 안내 — 노령연금의 종류"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-16
    result: verified
  - item: "지급 시작 달과 지급일"
    value: "국민연금법 제54조: 연금은 지급하여야 할 사유가 생긴 날이 속하는 달의 다음 달부터 수급권이 소멸한 날이 속하는 달까지 지급. 매월 25일 지급, 토요일·공휴일이면 그 전날. 공단 안내: 연금지급일 매월 25일(토요일 및 공휴일인 경우 전일)"
    agency: "국가법령정보센터 / 국민연금공단"
    document: "국민연금법 제54조, 노령연금 업무처리 절차"
    url: "https://www.law.go.kr/법령/국민연금법"
    effectiveDate: "2026-10-20"
    checkedAt: 2026-11-16
    result: verified
  - item: "1964년생 생월별 첫 지급 달 표"
    value: "법 제54조제1항(사유가 생긴 날이 속하는 달의 다음 달부터)을 1964년생의 만 63세 도달 월(2027년 1~12월)에 적용한 직접 계산. 1월생 2027년 2월분 … 12월생 2028년 1월분"
    agency: "국가법령정보센터"
    document: "국민연금법 제54조 기준 직접 계산"
    url: "https://www.law.go.kr/법령/국민연금법"
    effectiveDate: "2026-10-20"
    checkedAt: 2026-11-16
    result: verified
  - item: "연기연금(노령연금 연기제도)"
    value: "수급권 취득 후 출생연도별 지급개시연령 도달일로부터 5년이 될 때까지(최대 5년) 연금액의 전부 또는 일부 지급 연기 가능. 연기비율 50·60·70·80·90%·전부 중 선택. 연기된 매 1년당 7.2%(월 0.6%) 가산. 연기로 연금액이 늘면 연금소득세·건강보험료·기초연금액에 영향 가능. 법 제62조: 매 1개월마다 1천분의 6 가산"
    agency: "국민연금공단 / 국가법령정보센터"
    document: "노령연금 안내 — 노령연금 연기제도, 국민연금법 제62조"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-16
    result: verified
  - item: "소득활동에 따른 감액 기준"
    value: "월평균소득금액이 A값+200만원(2026년 기준 519만원, A값 3,193,511원) 이상인 경우 지급개시연령부터 5년 동안 감액. 감액한도 노령연금의 1/2. 근로소득만 있는 경우 총급여 75,865,403원 이상(12개월 종사 기준). 조기노령연금 수급자는 소득 있는 업무 종사 시 지급 정지, 지급개시연령부터 5년간은 감액 적용"
    agency: "국민연금공단"
    document: "노령연금 안내 — 소득활동에 따른 노령연금액, 조기노령연금"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-16
    result: verified
  - item: "의무 가입 종료(60세)와 임의계속가입(65세까지)"
    value: "국민연금법 제12조: 사업장·지역·임의가입자는 60세가 된 날의 다음 날에 자격 상실. 제13조: 65세가 될 때까지 공단에 신청하면 임의계속가입자가 될 수 있음. 1964년생은 2024년에 만 60세"
    agency: "국가법령정보센터"
    document: "국민연금법 제12조, 제13조"
    url: "https://www.law.go.kr/법령/국민연금법"
    effectiveDate: "2026-10-20"
    checkedAt: 2026-11-16
    result: verified
  - item: "청구 방법·구비서류·처리기간"
    value: "수급권자 본인 청구 원칙. 전국 지사 어디서나 청구. 내방, 우편, 팩스, 디지털 ARS, 인터넷(공단 홈페이지·정부24), 모바일(내 곁에 국민연금). 필수: 노령연금지급청구서, 신분증, 혼인관계증명서 상세(주민등록번호 포함, 공단 자료로 갈음 가능), 수급권자 예금계좌. 해당 시 가족관계증명서 상세. 내방 시 담당자 작성 청구서 확인 후 전자서명. 처리기간 30일 이내"
    agency: "국민연금공단"
    document: "노령연금 안내 — 청구방법, 노령연금 업무처리 절차"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-16
    result: verified
  - item: "청구기한(소멸시효 5년, 5년 소급 지급)"
    value: "공단: 수급권 발생 후 5년 안에 청구하지 않으면 소멸시효 완성. 다만 청구일로부터 역산하여 최근 5년 이내 급여분을 지급하고 이후 매월 지급. 법 제115조: 급여를 받을 권리는 5년간 행사하지 않으면 시효로 소멸"
    agency: "국민연금공단 / 국가법령정보센터"
    document: "노령연금 안내 — 청구방법(청구기한), 국민연금법 제115조"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-16
    result: verified
  - item: "연기 시 금액표와 단순 회수 기간"
    value: "원래 연금 100만원 가정, 연 7.2% 단순 가산: 107.2 / 114.4 / 121.6 / 128.8 / 136만원. 회수 기간: 1년 연기 시 포기 1,200만원 ÷ 월 7.2만원 = 166.7개월(약 13년 11개월), 5년 연기도 6,000만원 ÷ 36만원 = 166.7개월. 물가 인상·세금·건강보험료 미반영 직접 계산 → 본문에 단순 계산으로 명시"
    agency: "국민연금공단"
    document: "노령연금 연기제도(가산율) 기준 직접 계산"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-16
    result: partial
  - item: "생일이 1일인 경우의 첫 지급 달, 공단의 청구 안내 시기"
    value: "연령 도달일 계산상 1일생은 한 달 차이가 날 수 있다는 점과 공단이 지급연령 도달 전에 청구 안내를 보내는 시기는 공식 문서로 확인하지 못함(공단 청구방법 탭에 '청구안내대상자' 언급만 있음) → 본문에 '공단(1355) 확인'으로 안내"
    agency: "국민연금공단"
    document: "노령연금 안내 — 청구방법(해당 내용 명시 없음)"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-16
    result: partial
  - item: "조기노령연금 감액 구조(1964년생 적용)"
    value: "공단 예시는 1966년생(59세 기준): 59세 70%, 60세 76%, 61세 82%, 62세 88%, 63세 94%로 1년당 6%포인트 차이. 1964년생(58세 기준)에 대한 별도 표는 공단 페이지에 없어 본문은 '1년 앞당길 때마다 6%포인트씩 줄어드는 구조'로만 서술"
    agency: "국민연금공단"
    document: "노령연금 안내 — 조기노령연금 연령별 지급률 예시"
    url: "https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0056M0.do"
    effectiveDate: "2026-06-17"
    checkedAt: 2026-11-16
    result: partial
  - item: "2027년 기준 금액(A값, 감액 기준, 연금 인상률)"
    value: "본문의 감액 기준 519만 3,511원과 연봉 환산 약 7,586만원은 2026년 기준. 2027년 A값과 물가 인상률은 미발표(1월 발표 예정) → 본문에 2026년 기준임을 명시. 1월 갱신 대상"
