    value: "노령연금 지급연령 상향조정(법률 제8541호 부칙 제8조): 1953-56년생 61세/56세, 1957-60년생 62세/57세, 1961-64년생 63세/58세, 1965-68년생 64세/59세, 1969년생 이후 65세/60세. 가입기간 10년 이상이면 지급개시연령 이후 평생 지급. 1952년생 이전은 공단 표에 없어 본문에 싣지 않음"
    agency: "국민연금공단"
