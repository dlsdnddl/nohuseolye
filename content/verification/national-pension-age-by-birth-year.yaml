    value: "공단 예시는 '1966년생(조기 지급개시 59세)': 59세 70%, 60세 76%, 61세 82%, 62세 88%, 63세 94%. 다른 출생연도에 '정상보다 N년 일찍' 구조로 일반화한 것은 직접 적용 → 본문에 공단 예시(1966년생) 기준과 1355 확인 표기"
