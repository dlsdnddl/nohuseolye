  - item: "1960~1974년생 정상 수령 시작·조기 수령 가능·의무 납부 종료 연도 표"
    value: "위 지급개시연령표와 법 제12조(60세가 된 날의 다음 날 자격 상실)에 출생연도를 더한 직접 계산. 예: 1963년생 63세 → 2026년, 1969년생 65세 → 2034년, 1966년생 60세 → 2026년 납부 종료. 개별 출생연도 글(1964~1969년생)의 값과 대조해 일치 확인"
    agency: "국민연금공단 / 국가법령정보센터"
