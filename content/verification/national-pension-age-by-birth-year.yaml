  - item: "첫 지급 시점(도달 월의 다음 달분, 매월 25일)과 본인 청구, 처리기간, 시효 5년"
    value: "국민연금법 제54조: 지급 사유가 생긴 달의 다음 달부터 지급, 매월 25일. 공단 청구방법: 본인 청구, 처리기간 30일 이내. 법 제115조: 시효 5년, 최근 5년 이내 급여분 소급"
    agency: "국가법령정보센터 / 국민연금공단"
