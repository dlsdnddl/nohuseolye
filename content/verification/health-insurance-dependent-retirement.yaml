    value: "별표 1(개정 2018.3.6 본문) 원문 확인: 배우자·부모·자녀·조부모·손자녀·직계비속 배우자·배우자 부모 등 관계별 동거/비동거 요건, 형제·자매는 30세 미만·65세 이상·등록 장애인·국가유공자 등 해당자. 본문 표는 핵심만 요약했고 세부 단서는 원문 참조 안내. 이후 개정 이력은 시행규칙 개정이유 목록에서 별표 1 변경을 찾지 못함"
