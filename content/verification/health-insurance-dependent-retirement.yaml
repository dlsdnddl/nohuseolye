  - item: "임의계속가입 신청기한·적용기간·보수월액·전액 부담"
    value: "지역가입자가 된 후 최초 지역보험료를 고지받은 날부터 납부기한에서 2개월이 지나기 이전까지 신청(법 제110조 제1항). 첫 보험료를 납부기한부터 2개월 지나도록 미납 시 자격 유지 불가(제2항). 보수월액은 최근 12개월 평균(제3항), 전액 본인 부담(제5항). 적용기간은 사용관계가 끝난 날의 다음 날부터 36개월이 되는 날을 넘지 않는 범위(시행령 제77조)"
    agency: "국민건강보험공단 건강Law"
    document: "국민건강보험법 제110조 / 시행령 제77조"
