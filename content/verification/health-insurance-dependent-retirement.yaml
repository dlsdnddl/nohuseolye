    value: "별표 1의2 제1호 나목: 사업자등록이 되어 있지 않고 사업소득 합계가 연 500만원 이하이면 사업소득이 없는 것으로 봄(주택임대소득이 있는 경우 제외). 장애인 등록자·국가유공자 등(상이등급)·보훈보상대상자도 연 500만원 이하이면 예외"
