    value: "시행령 제41조 제1항 제5호 단서: 공적연금소득은 연금소득공제(소득세법 제20조의3 제2항)를 적용하지 않고 해당 과세기간 발생 연금소득 전부를 연금소득으로 함. 법제처 19-0263의 100분의 30 언급은 해석 당시 법령 기준이라 본문에서 삭제"
