  - item: "피부양자 소득·사업소득·재산 기준"
    value: "별표 1의2(개정 2025.4.23 본문, 국가법령정보센터 원문): 소득 합계 연 2천만원 이하, 사업소득 없을 것(사업자등록 없고 연 500만원 이하 등 예외, 주택임대소득 있으면 예외 제외), 기혼자는 부부 모두 충족, 재산세 과세표준 합 5.4억 이하 또는 5.4억 초과~9억 이하+소득 연 1천만원 이하, 형제·자매 1.8억 이하. 2023.9.11 본문과 수치 동일. 이후 시행규칙 개정(2025.12.1, 2026.3.25, 2026.9.28) 개정이유에서 별표 1의2 변경 언급 없음"
    agency: "국가법령정보센터(보건복지부령)"
    document: "국민건강보험법 시행규칙 [별표 1의2]"
    url: "https://www.law.go.kr/LSW/flDownload.do?flSeq=160135013&bylClsCd=110201"
    effectiveDate: "2025-04-23"
    checkedAt: 2026-11-10
    result: verified
