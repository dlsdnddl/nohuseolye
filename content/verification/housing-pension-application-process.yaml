    value: "등본 2부, 초본 1부, 전입세대확인서 1부, 인감증명서 2부(본인서명사실확인서 대체 가능), 가족관계증명서 1부, 신탁은 지방세납세증명서, 오피스텔은 과세증명서, 우대형은 기초연금 수급확인서, 등기권리증 원본, 선순위 있으면 금융거래확인서. 소유자 기준·부부 모두 방문. 개인 상황에 따라 추가될 수 있음"
    agency: "한국주택금융공사"
