    value: "상담·신청 → 심사 → 보증약정·담보설정 → 보증서 발급 → 대출실행. 비용은 법무사 수수료·등록면허세·지방교육세·인지세, 경우에 따라 감정평가 비용. 최초 월지급금 수령 시 납부 가능. 상담·신청은 관할 지사, 기초상담은 시중은행 가능"
    agency: "한국주택금융공사"
