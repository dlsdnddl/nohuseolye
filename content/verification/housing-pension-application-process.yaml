  - item: "신청 절차(상담·신청 → 심사·보증 → 대출 실행)와 소요기간"
    value: "공사 단계(보증신청 접수·시세확인·담보주택조사·보증심사 및 승인·보증서 발급) 약 10~20일, 금융기관 단계(대출약정·실행) 약 1~5일. 서류 보완·감정평가 진행에 따라 변동. 본문의 '합계 보통 2~4주'는 두 범위를 더한 일반적 추정(공식 문구 아님)으로 표기"
    agency: "한국주택금융공사"
