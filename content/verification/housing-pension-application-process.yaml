    value: "초기보증료 주택가격의 1.0%(최초 연금지급일 납부), 2.5억 미만 1주택자 감정평가수수료 필요 시 지원, 지킴이통장 월 250만원까지 압류 금지, 우대형은 기초연금 수급권자+2.5억 미만 1주택, 주택가격 한국부동산원→KB 시세→감정평가, 보증금 있는 일부 임대는 신탁방식만 가능"
