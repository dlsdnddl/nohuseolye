    value: "부부 중 1명 55세 이상, 부부합산 공시가격 12억원 이하(다주택 합산 12억 이하 가능, 12억 초과 2주택자는 3년 내 1주택 처분 조건), 주민등록 전입 거주요건(일부 예외), 의사능력, 대상: 주택법 주택·노인복지주택·주거목적 오피스텔"
