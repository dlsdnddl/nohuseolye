  - item: "2027년 기초연금 개편 정부안(예산안 기준, 확정 전)"
    value: "하위 0~30% 월 38만원, 30~45% 35만 9천원, 45~70% 35만원. 하위 45%까지 부부감액 20% → 10%. 직역연금 수급자·배우자 하위 45% 지원(2027년 7월). 차등지급·부부감액은 2027년 4월 목표. 기초연금 예산 23.1조 → 25.7조원. 2026년 기준연금액 34만 9,700원. 국회 예산 심의와 기초연금법 개정 필요(basic-pension-2027-increase 검증표와 동일 출처)"
