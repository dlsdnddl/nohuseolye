  - item: "2027년 기준 중위소득과 생계·의료급여 선정기준"
    value: "4인 가구 6.70% 인상. 기준 중위소득 1인 2,564,238 → 2,736,042원, 2인 4,199,292 → 4,480,645원. 생계급여(32%) 1인 82만 556 → 87만 5,533원, 2인 134만 3,773 → 143만 3,806원. 의료급여(40%) 1인 102만 5,695 → 109만 4,417원, 2인 167만 9,717 → 179만 2,258원. 실제 생계급여액은 선정기준액에서 소득인정액 차감"
