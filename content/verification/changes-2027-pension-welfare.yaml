    value: "지역가입자 보험료에 새 소득·재산 자료가 매년 11월 반영된다는 설명과 A값·선정기준액의 '1월 전후' 발표 시기는 예년 관행 기준 서술. 이번에 공식 문서로 다시 확인하지 않음 → 본문에서 개별 금액은 공단·주민센터 확인으로 안내"
