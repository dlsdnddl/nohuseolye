  - item: "2026년 건강보험료 대비 장기요양보험료율 약 13.14%"
    value: "0.9448% ÷ 7.19% = 13.14%로 직접 계산(언론 보도 수치와 일치). 건보료 10만원일 때 약 13,140원 → 13,900원 비교에 사용. 2026년 비율의 공식 문서는 이번에 직접 확인하지 않음 → 본문에 '약'으로 표기"
    agency: "보건복지부"
    document: "2026.10.30 장기요양위원회 보도자료(2027년 13.90%) 기준 역산"
