    value: "간호·간병통합서비스는 급성기 병원의 통합서비스 병동 대상(요양병원 제외), 본인부담상한제는 비급여인 간병비가 포함되지 않음. 이번 작성 시 공식 원문을 다시 확인하지 않은 일반 제도 설명 → 본문에서 병원·건보공단 문의로 안내"
