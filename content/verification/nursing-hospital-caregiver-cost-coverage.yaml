  - item: "본인부담 20~30%·차상위 20%, 간병인 배치 기준(언론 보도)"
    value: "환자 본인부담 20~30% 수준 검토, 차상위계층 20% 수준 검토. 간병인 1인당 환자 4~6명, 2교대 이상. 간병 급여일수 상한과 장기입원 시 본인부담 상향, 경증환자 본인부담 인상 추진. 의학신문(8.19)·뉴스핌(7.28) 보도로만 확인 → 본문에 '검토·논의'로 표기"
