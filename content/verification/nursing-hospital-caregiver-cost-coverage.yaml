  - item: "의료중심 요양병원 선정 기준·규모(언론 보도)"
    value: "약 500개소 내외. 필수요건: 의료기관 인증, 입원급여 적정성 평가 1·2등급, 100병상 이상. 간병인 직접고용 원칙, 특화기능 보유 시 조건부 지정. 7.28 토론회 복지부 발표 내용을 전한 병원신문·뉴스핌 보도로만 확인(복지부 보도자료 본문에는 수치 없음) → 본문 '언론 보도 단계' 열에 기재"
