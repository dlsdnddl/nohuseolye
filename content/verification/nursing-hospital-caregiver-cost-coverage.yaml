  - item: "현재 간병비 수준과 본문의 단순 계산"
    value: "개인 간병 월 370만원, 공동 간병 월 60만~90만원(복지부 토론회 발표를 전한 뉴스핌 보도. 의학신문은 64만~90만원으로 보도). 본문 '30% 단순 계산 18만~27만원'은 60만~90만원×30%의 산술 계산이며 간병 수가 미확정으로 실제 부담액과 다름 → 본문에 단순 계산임을 명시"
